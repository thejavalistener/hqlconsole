plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    // La consola entra como una dependencia más: nada de @Import ni de escanear paquetes.
    implementation project(':hql-console-starter')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.h2database:h2'
}

// Nombre fijo para poder copiar el jar y correrlo como lo haría un usuario.
tasks.named('bootJar') {
    archiveFileName = 'hql-console-demo.jar'
}
