plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'maven-publish'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    // La consola entra como una dependencia más: nada de @Import ni de escanear paquetes.
    implementation project(':hql-console-starter')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.h2database:h2'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

// Nombre fijo para poder copiar el jar y correrlo como lo haría un usuario.
tasks.named('bootJar') {
    archiveFileName = 'hql-console-demo.jar'
}

// El demo también se publica, con el mismo criterio que el starter: JitPack arma la lista de
// módulos de un build multi-módulo con los artefactos que cada submódulo publica, así que dejar
// uno afuera hace que el build no se reconozca como multi-módulo.
publishing {
    publications {
        maven(MavenPublication) {
            groupId project.group
            artifactId project.name
            version project.version
        }
    }
}
