// Versión única de Spring Boot para todo el build. Si la cambiás acá, cambiala
// también en la BOM que importa jpql-console-starter/build.gradle.
pluginManagement {
    plugins {
        id 'org.springframework.boot' version '3.2.5'
        id 'io.spring.dependency-management' version '1.1.4'
    }
}

rootProject.name = 'jpql-console'

include 'jpql-console-starter'
include 'jpql-console-demo'
